<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'">
<title>ThodCanvas</title><link rel="stylesheet" href="styles.css"><script src="thodhub.js"></script><script src="editor.js" defer></script></head>
<body><header><div class="identity"><img src="icon.svg" alt=""><strong>ThodCanvas</strong><span id="doc-name">Редактор изображений</span></div><div class="header-actions"><button id="open">Открыть</button><button id="project-save" disabled>Сохранить проект</button><button id="export" class="primary" disabled>Экспорт PNG</button></div></header>
<input id="file" type="file" accept="image/*,.thodcanvas" hidden><input id="layer-file" type="file" accept="image/*" hidden><input id="background-file" type="file" accept="image/*" hidden>
<main><nav id="tools" aria-label="Инструменты"></nav><section id="viewport" tabindex="0" aria-label="Холст изображения"><canvas id="screen"></canvas><div id="welcome"><img src="icon.svg" alt=""><h1>Начните с изображения</h1><p>Перетащите файл или выберите на компьютере</p><button id="welcome-open" class="primary">Выбрать изображение</button><button id="recover" hidden>Восстановить незавершённый проект</button></div><div id="view-controls"><button id="undo" title="Отменить (Ctrl+Z)" disabled>↶</button><button id="redo" title="Повторить (Ctrl+Shift+Z)" disabled>↷</button><span class="divider"></span><button id="zoom-out" title="Уменьшить">−</button><button id="fit" title="Вписать в окно">Вписать</button><button id="actual" title="Исходный масштаб">100%</button><button id="zoom-in" title="Увеличить">+</button></div></section>
<aside><section><h2 id="tool-title">Инструмент</h2><div id="tool-hint" class="muted">Откройте изображение</div><label>Цвет <input id="color" type="color" value="#3676e8"></label><div id="palette"></div><label>Размер <input id="size" type="range" min="1" max="400" value="28"><output id="size-value">28</output></label><label>Мягкость <input id="softness" type="range" min="0" max="100" value="0"></label><label>Допуск выделения <input id="tolerance" type="range" min="0" max="150" value="32"></label><label class="check"><input id="fill" type="checkbox">Заливка фигур</label><details><summary>Текст</summary><textarea id="text" rows="3" placeholder="Ваш текст">Ваш текст</textarea><label>Кегль <input id="font-size" type="number" min="6" max="1000" value="64"></label><label class="check"><input id="bold" type="checkbox">Полужирный</label><button id="text-apply">Применить к текстовому слою</button></details></section>
<section><h2>Выделение</h2><div class="button-grid"><button id="select-ai">Автовыделение</button><button id="select-all">Всё</button><button id="select-invert">Инверсия</button><button id="select-none">Снять</button><button id="selection-delete">Стереть выделенное</button><button id="cutout" class="accent">Удалить фон</button></div><p class="muted">Если есть выделение, фон удаляется только внутри него.</p></section>
<section><h2>Фон и объект</h2><div class="button-grid"><button id="background-color">Фон: выбранный цвет</button><button id="background-image">Фон: изображение</button><button id="background-blur">Размыть фон</button><button id="outline">Обводка объекта</button></div><label>Радиус эффекта <input id="effect-size" type="range" min="1" max="80" value="12"></label></section>
<section class="layer-section"><div class="section-head"><h2>Слои</h2><button id="layer-add" title="Новый прозрачный слой">+</button><button id="layer-import" title="Добавить изображение">Фото</button></div><label>Непрозрачность <input id="opacity" type="range" min="0" max="100" value="100"></label><div id="layers"></div><div class="button-grid"><button id="layer-up">Выше</button><button id="layer-down">Ниже</button><button id="layer-copy">Дубликат</button><button id="layer-delete" class="danger">Удалить слой</button></div><details><summary>История</summary><ol id="history"></ol></details></section></aside></main>
<footer><span id="status" role="status">Исходник не изменяется</span><span id="dimensions"></span></footer>
<div id="busy" hidden><span id="busy-label">Подготовка…</span><progress id="progress" max="100"></progress><button id="cancel">Отмена</button></div>
<dialog id="message-dialog"><form method="dialog"><h2 id="message-title"></h2><p id="message-text"></p><div class="dialog-actions"><button value="cancel" id="message-cancel">Отмена</button><button value="ok" class="primary">Продолжить</button></div></form></dialog>
</body></html>
