<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'">
<title>ThodCanvas</title><link rel="stylesheet" href="styles.css"><script src="thodhub.js"></script><script src="editor.js" defer></script></head>
<body><header><div class="identity"><img src="icon.svg" alt=""><strong>ThodCanvas</strong><span id="doc-name">Редактор изображений</span></div><div class="header-actions"><button id="open">Открыть</button><button id="project-save" disabled>Сохранить проект</button><button id="export" class="primary" disabled>Экспорт PNG</button></div></header>
<input id="file" type="file" accept="image/*,.thodcanvas" hidden>
<main><nav id="tools" aria-label="Инструменты"></nav><section id="viewport" tabindex="0" aria-label="Холст изображения"><canvas id="screen"></canvas><div id="welcome"><img src="icon.svg" alt=""><h1>Откройте изображение</h1><p>Перетащите файл в окно или выберите на компьютере</p><button id="welcome-open" class="primary">Выбрать изображение</button></div><div id="view-controls"><button id="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить" disabled>↶</button><button id="redo" title="Повторить (Ctrl+Shift+Z)" aria-label="Повторить" disabled>↷</button><span class="divider"></span><button id="zoom-out" title="Уменьшить" aria-label="Уменьшить">−</button><button id="fit" title="Вписать в окно (Ctrl+0)">Вписать</button><button id="actual" title="Исходный масштаб">100%</button><button id="zoom-in" title="Увеличить" aria-label="Увеличить">+</button></div></section>
<aside><section class="panel" id="layers-panel"><div class="panel-head"><h2>Слои</h2><button id="layer-add" class="icon-button" title="Новый прозрачный слой" aria-label="Новый слой" disabled>+</button></div><div id="layers" role="list"></div><label class="opacity-row" for="opacity"><span>Непрозрачность</span><input id="opacity" type="range" min="0" max="100" value="100" disabled><output id="opacity-value">100%</output></label></section>
<section class="panel" id="tool-panel"><div class="panel-head"><h2 id="tool-title">Перемещение</h2></div>
<div class="field" id="field-color" hidden><span class="field-label">Цвет</span><div class="color-row"><input id="color" type="color" value="#3676e8" aria-label="Цвет"><div id="palette" class="palette"></div></div></div>
<div class="field" id="field-size" hidden><label class="field-label" for="size">Размер</label><div class="range-row"><input id="size" type="range" min="1" max="200" value="24"><output id="size-value">24</output></div></div>
<div class="field" id="field-softness" hidden><label class="field-label" for="softness" title="100 — чёткий край, 0 — мягкая кисть">Жёсткость</label><div class="range-row"><input id="softness" type="range" min="0" max="100" value="100"><output id="softness-value">100</output></div></div>
<div class="field" id="field-bgcolor" hidden><label class="check" title="Снимите галочку, чтобы стирать до полной прозрачности"><input id="erase-bg" type="checkbox" checked>Стирать фоном</label><div id="erase-bg-color"><span class="field-label">Цвет фона</span><div class="color-row"><input id="bgcolor" type="color" value="#ffffff" aria-label="Цвет фона"><span class="swatch-value" id="bgcolor-hex">#FFFFFF</span></div></div></div>
<div class="field" id="field-tolerance" hidden><label class="field-label" for="tolerance">Допуск цвета</label><div class="range-row"><input id="tolerance" type="range" min="0" max="150" value="32"><output id="tolerance-value">32</output></div></div>
<div class="field" id="field-text" hidden><span class="field-label">Текст</span><label class="mini-label" for="font">Шрифт</label><select id="font" class="select-input" aria-label="Шрифт"></select><div class="inline-row"><label class="mini-label" for="font-size">Кегль</label><input id="font-size" class="number-input" type="number" min="8" max="400" value="64"><label class="check"><input id="bold" type="checkbox">Полужирный</label></div></div>
<div class="field" id="field-select" hidden><div class="button-row selection-actions"><button id="select-all">Выделить всё</button><button id="select-none">Снять выделение</button></div><button id="select-invert" class="wide">Инвертировать выделение</button><span class="field-label separated">С выделением</span><div class="action-grid"><button id="selection-fill">Залить</button><button id="selection-delete">Удалить</button><button id="selection-copy">Копировать на слой</button><button id="selection-cut">Вырезать на слой</button></div><button id="selection-cutout" class="wide">Удалить фон ИИ</button></div>
<div class="field" id="field-crop" hidden><button id="crop-apply" class="primary wide">Кадрировать (Enter)</button></div>
<div class="field" id="field-background" hidden><button id="cutout" class="primary wide">Удалить фон ИИ</button><button id="erase-selection" class="wide">Удалить выделенное</button></div>
</section></aside></main>
<footer><span id="status" role="status">Исходник не изменяется</span><span id="dimensions"></span></footer>
<div id="busy" hidden><span id="busy-label">Подготовка…</span><progress id="progress" max="100" value="0"></progress><output id="busy-percent">0%</output><button id="cancel">Отмена</button></div>
<div id="tool-flyout" role="menu" hidden></div>
<div id="menu" class="menu" role="menu" hidden></div>
<dialog id="message-dialog"><div class="dialog-body"><h2 id="message-title"></h2><p id="message-text"></p><div class="dialog-actions"><button type="button" id="message-cancel">Отмена</button><button type="button" id="message-ok" class="primary">Продолжить</button></div></div></dialog>
</body></html>
